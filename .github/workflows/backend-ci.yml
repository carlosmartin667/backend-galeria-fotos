name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build-test:
    name: Restore, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore fotografia-backend-api.slnx

      - name: Build
        run: dotnet build fotografia-backend-api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test fotografia-backend-api.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
